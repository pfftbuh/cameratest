{% extends "base.html" %}
{% block content %}
<h1>Welcome, Teacher!</h1>

<div class="card">
  <h2 style="font-size:17px;margin:0 0 6px">Manage Exams</h2>
  <p class="sub" style="margin-bottom:14px">
    Create a new exam or view your existing exams.
  </p>
  <p style="margin-bottom:0">
    <a class="btn" href="{% url 'create_exam' %}">Create Exam</a>
    <a class="btn" href="{% url 'exams_list' %}">View Exams</a>
  </p>
</div>

<div class="card">
  <h2 style="font-size:17px;margin:0 0 6px">Manage Students</h2>
  <p class="sub" style="margin-bottom:14px">
    View and update student class designations.
  </p>
  <p style="margin-bottom:0">
    <a class="btn" href="{% url 'manage_students' %}">View Students</a>
  </p>
</div>
{% endblock %}
