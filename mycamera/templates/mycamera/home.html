<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Camera App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    video {
      width: 640px;
      height: 480px;
      border: 2px solid #333;
      margin-top: 10px;
    }
    select {
      margin-top: 20px;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>Hello, World! This is the home page of my camera app.</h1>

  <label for="cameraSelect">Choose Camera:</label>
  <select id="cameraSelect"></select>
  <br>
  <video id="video" autoplay playsinline></video>

  <script>
    const videoElement = document.getElementById('video');
    const cameraSelect = document.getElementById('cameraSelect');
    let currentStream;
    let pc; // WebRTC PeerConnection
    const socket = new WebSocket("ws://localhost:8000/ws/webrtc/");

    // List available cameras
    async function getCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(device => device.kind === 'videoinput');
      cameraSelect.innerHTML = '';
      videoDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `Camera ${index + 1}`;
        cameraSelect.appendChild(option);
      });
    }

    // Start selected camera and send to backend
    async function startCamera(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      const constraints = {
        video: { deviceId: deviceId ? { exact: deviceId } : undefined }
      };
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      videoElement.srcObject = currentStream;

      // Setup WebRTC connection
      pc = new RTCPeerConnection();
      currentStream.getTracks().forEach(track => pc.addTrack(track, currentStream));

      pc.onicecandidate = event => {
        if (event.candidate) {
          socket.send(JSON.stringify({ "candidate": event.candidate }));
        }
      };

      // Create offer and send to Django backend
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.send(JSON.stringify({ "sdp": offer }));
    }

    // Handle dropdown change
    cameraSelect.addEventListener('change', () => {
      startCamera(cameraSelect.value);
    });

    // Handle signaling messages from backend
    socket.onmessage = async event => {
      const data = JSON.parse(event.data);
      if (data.sdp) {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      }
      if (data.candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    };

    // Initialize
    (async () => {
      await getCameras();
      if (cameraSelect.options.length > 0) {
        startCamera(cameraSelect.value);
      }
    })();
  </script>
</body>
</html>
